<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CoLab Client Profile</title>
  <meta name="description" content="CoLab case-conferencing client profile prototype for Allegheny County DHS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3 2.4"></circle><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"></circle></svg>
          CoLab
        </div>
        <nav class="top-actions" aria-label="Profile actions">
          <button type="button" class="btn-ghost" data-icon="bug">Report Issue</button>
          <button type="button" class="btn-ghost" data-icon="mail">Share Profile</button>
          <div class="user-chip">
            <span data-icon="user" aria-hidden="true"></span>
            <div><strong>Jimothy Jones</strong><span>MCI ID: 1234567890</span></div>
          </div>
        </nav>
      </header>

      <div class="body">
        <nav class="rail" aria-label="Main">
          <button type="button" class="rail-btn" aria-label="Home" data-icon="home"></button>
          <button type="button" class="rail-btn" aria-label="Caseload" data-icon="inbox"></button>
          <button type="button" class="rail-btn" aria-label="Favorites" data-icon="star"></button>
          <div class="rail-divider"></div>
          <button type="button" class="rail-btn" aria-label="Client profile" aria-current="page" data-icon="user"></button>
          <div class="rail-avatar" aria-label="Signed in as LB">LB</div>
        </nav>

        <div class="work">
          <main class="main" id="main" tabindex="-1"></main>
          <div id="panel-slot" style="display: contents"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
